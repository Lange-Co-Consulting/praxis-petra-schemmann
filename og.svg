<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EDE0"/>
      <stop offset="1" stop-color="#EAE0CC"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix values="0 0 0 0 0.16 0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0.18 0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.6"/>

  <!-- Mark circle -->
  <g transform="translate(80,80)" stroke="#3F4D3A" fill="none" stroke-width="1.5">
    <circle cx="34" cy="34" r="32"/>
    <path d="M22 22 Q34 10 46 22 Q58 34 46 46 Q34 58 22 46 Q10 34 22 22 Z"/>
    <circle cx="34" cy="34" r="3" fill="#C66B47" stroke="none"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="240" font-family="Inter, sans-serif" font-size="20" font-weight="500" letter-spacing="3" fill="#54493B">PRAXIS · EIGELTINGEN</text>

  <!-- Title -->
  <text x="80" y="340" font-family="Fraunces, Georgia, serif" font-size="86" font-weight="380" fill="#2A2620" letter-spacing="-2">Petra Schemmann</text>
  <text x="80" y="430" font-family="Fraunces, Georgia, serif" font-size="56" font-style="italic" font-weight="350" fill="#3F4D3A" letter-spacing="-1">Physiotherapie &amp; Klopftherapie</text>

  <!-- Tagline -->
  <text x="80" y="510" font-family="Inter, sans-serif" font-size="24" fill="#54493B">Über 30 Jahre Erfahrung · Sektorale Heilpraktikerin · EFT</text>

  <!-- Bottom mark -->
  <line x1="80" y1="560" x2="220" y2="560" stroke="#C66B47" stroke-width="2"/>
  <text x="80" y="590" font-family="Inter, sans-serif" font-size="18" font-weight="500" letter-spacing="2" fill="#8B7E6C">PRAXIS-PETRA-SCHEMMANN.DE</text>
</svg>
